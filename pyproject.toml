[project]
name = "job-hunter"
version = "0.1.0"
description = "AI job hunting agent with Google ADK and Arcade tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arcadepy>=1.10.0",
    "dotenv>=0.9.9",
    "google-adk>=2.1.0",
    "typer>=0.25.1",
]


[project.scripts]
"job-hunter" = "job_hunter.cli:run_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
